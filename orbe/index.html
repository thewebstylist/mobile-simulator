:root{--ink:#f3f6ff;--cyan:#5ef3ff;--bezel:#030409}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#0b0f3a;color:var(--ink);
  font-family:"Orbe Mono",ui-monospace,monospace;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.vh{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---------- layers ---------- */
.stage{position:absolute;inset:0;overflow:hidden}
.cover{container-type:size}
.cover>.frame{position:absolute;left:50%;top:50%;
  --u:max(100cqw / 2048,100cqh / 1360);
  width:calc(2048 * var(--u));height:calc(1360 * var(--u));transform:translate(-50%,-50%)}
.pinned{--u:min(100vw / 2048,100vh / 1150)}
.frame>*{position:absolute;inset:0;width:100%;height:100%;display:block}

/* sky */
#plate{object-fit:cover}
#loop{position:absolute;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
#sky{opacity:0;transition:opacity 1s}
#sky.on{opacity:1}
#sky.dead{display:none}

/* figure */
#ph{transition:opacity 1.4s}
#ph.off{opacity:0!important}
#fig{opacity:0;transition:opacity 1.4s;pointer-events:none}
#fig.on{opacity:1}
#fig.dead{display:none}
.stage-fig{pointer-events:none}

/* headline */
.hl{position:absolute;left:0;top:calc(100 * var(--u));height:calc(260 * var(--u));width:calc(8000 * var(--u))}
.hl svg{display:block;width:100%;height:100%;overflow:visible}
.track{animation:mq 34s linear infinite}
@keyframes mq{to{transform:translateX(-2352px)}}
.paused .track{animation-play-state:paused}

/* ui */
.stage-ui{pointer-events:none}
.copy{position:absolute;top:calc(50% - 101 * var(--u));font-size:calc(21.4 * var(--u));line-height:calc(30 * var(--u));
  text-transform:uppercase;letter-spacing:0;white-space:nowrap}
.copy-l{left:calc(102 * var(--u));text-align:left}
.copy-r{right:calc(95 * var(--u));text-align:right}
.copy .plus{letter-spacing:.24em;position:relative;top:calc(-5 * var(--u))}
.copy-r .plus{margin-right:-.24em}
.copy .sp{height:calc(21 * var(--u))}
.word{position:absolute;bottom:calc(120 * var(--u));height:calc(160 * var(--u))}
.word svg{display:block;width:100%;height:100%;fill:var(--ink)}
.word-new{left:calc(60 * var(--u));width:calc(480 * var(--u))}
.word-era{right:calc(48 * var(--u));width:calc(420 * var(--u))}
.cta{position:absolute;--bu:var(--u);width:calc(330 * var(--bu));height:calc(102 * var(--bu));
  left:calc(50% - 162 * var(--u));bottom:calc(131 * var(--u));pointer-events:auto}
.btn{position:relative;display:block;width:100%;height:100%;outline-offset:4px}
.btn:focus-visible{outline:2px solid var(--cyan)}
.btn svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.btn .chip{transform-origin:1180px 1175px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.btn .chev{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.btn .lab{position:absolute;left:calc(62 * var(--bu));top:50%;transform:translateY(-50%);line-height:1;
  font-size:calc(26.3 * var(--bu));letter-spacing:.01em;color:var(--ink);
  transition:color .5s cubic-bezier(.2,.8,.2,1),text-shadow .5s cubic-bezier(.2,.8,.2,1)}
.btn:hover .chip{transform:translateX(-6px) scaleX(1.07)}
.btn:hover .chev{transform:translateX(8px)}
.btn:hover .lab{color:#fff;text-shadow:0 0 calc(10 * var(--bu)) rgba(94,243,255,.6)}

/* ---------- HUD ---------- */
.hud{position:fixed;inset:0;z-index:10;pointer-events:none;--h:min(100vw / 2048,100vh / 1360);
  font-size:calc(23 * var(--h));line-height:1;white-space:pre;color:var(--ink)}
.hud>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud button{pointer-events:auto;line-height:1}
.hud button:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
.brand{position:absolute;left:50%;top:calc(14 * var(--h));transform:translateX(calc(-50% - 6 * var(--h)))}
.coords{position:absolute;left:50%;bottom:calc(27 * var(--h));transform:translateX(-50%);font-size:calc(21.3 * var(--h))}
.menu{position:absolute;right:calc(41 * var(--h));top:calc(42 * var(--h));font-size:calc(23 * var(--h));transition:color .3s}
.menu:hover{color:var(--cyan)}
.motion{position:absolute;left:calc(45 * var(--h));top:calc(40 * var(--h));display:flex;align-items:center;gap:calc(8 * var(--h));font-size:calc(23 * var(--h))}
.motion svg{display:block;width:calc(68 * var(--h));height:calc(22 * var(--h))}
.motion span{transition:color .3s}
.motion:hover span{color:var(--cyan)}

/* ---------- entrance guard ---------- */
.js .enter{opacity:0}
.js.entered .enter{opacity:1}

/* ---------- phone ---------- */
@media (max-width:820px){
  .hud{--h:calc(100vw / 860)}
  .hl{top:58px;height:120px;width:calc(8000px * 120 / 260)}
  .copy{top:186px;font-size:11px;line-height:14px}
  .copy .plus{top:-2px}
  .copy .sp{height:8px}
  .copy-l{left:20px}
  .copy-r{right:20px}
  .word{bottom:114px;height:50px}

    pivot.rotation.z+=(-0.045*tgt.x-pivot.rotation.z)*k;
    drift+=(14*tgt.x-drift)*k;
    pivot.position.x=PX+drift;
    pivot.position.y=PY+5*Math.sin(t*0.9);
    renderer.render(scene,camera);
  }

  canvas.addEventListener('webglcontextlost',(e)=>{e.preventDefault();lost=true;canvas.classList.add('dead')});
  new ResizeObserver(()=>{ if(resize()&&running&&(reduce||root.classList.contains('paused')))renderer.render(scene,camera) }).observe(canvas);

  new GLTFLoader().setCrossOrigin('anonymous').load(GLB,async(gltf)=>{
    const model=gltf.scene;
    const gb=new THREE.Box3();
    model.traverse((o)=>{
      if(!o.isMesh)return;
      o.geometry.computeBoundingBox();gb.union(o.geometry.boundingBox);
      const olds=Array.isArray(o.material)?o.material:[o.material];
      const news=olds.map(glass);
      o.material=Array.isArray(o.material)?news:news[0];
      olds.forEach((m)=>m.dispose());
    });
    uni.uMinY.value=gb.min.y;uni.uMaxY.value=gb.max.y;

    model.rotation.y=-Math.PI/2;                 // Tripo exports facing +X
    model.updateMatrixWorld(true);
    const box=new THREE.Box3().setFromObject(model);
    const c=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3());
    model.position.sub(c);
    pivot.scale.setScalar((1315-269)/sz.y);
    pivot.add(model);

    resize();
    try{ if(renderer.compileAsync)await renderer.compileAsync(scene,camera) }catch(e){}
    await orbe.entered;
    if(lost)return;
    renderer.render(scene,camera);
    running=true;
    canvas.classList.add('on');
    ph.classList.add('off');
    setTimeout(()=>orbe.releasePlaceholder(),2000);
    if(!reduce){last=performance.now();requestAnimationFrame(frame)}
  },undefined,(err)=>{console.warn('ORBE: figure model failed to load',err)});
}
</script>
</body>
</html>
